services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_local
      POSTGRES_DB: trading
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - trading_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard -d trading']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  trading_pg:
