name: Dashboard CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: trading_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dashboard -d trading_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dashboard:test_password@localhost:5432/trading_test
      TEST_DATABASE_URL: postgresql+asyncpg://dashboard:test_password@localhost:5432/trading_test
      ACCOUNT_TOKENS: '{"1":"ci-only-token-with-at-least-32-characters"}'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
